[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Redirección canónica: www y variantes a https://zinkerp.com (evita caché duplicada en redes)
[[redirects]]
  from = "https://www.zinkerp.com/*"
  to = "https://zinkerp.com/:splat"
  status = 301
  force = true

# Facturante quedó deprecado: la facturación fiscal sale por ARCA nativo
[[redirects]]
  from = "/integraciones/facturante"
  to = "/integraciones/arca/"
  status = 301
  force = true

[[redirects]]
  from = "/integraciones/facturante/*"
  to = "/integraciones/arca/"
  status = 301
  force = true

# Categorías del blog sin slug en Sanity
[[redirects]]
  from = "/blog/categoria/default"
  to = "/blog/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/categoria/null"
  to = "/blog/"
  status = 301
  force = true

# Bloquear archivos PHP maliciosos con 403 Forbidden
[[redirects]]
  from = "/*.php"
  to = "/403.html"
  status = 403

# Bloquear rutas específicas de WordPress
[[redirects]]
  from = "/wp-login.php"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/xmlrpc.php"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/wp-admin/*"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/wp-content/*"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/wp-includes/*"
  to = "/403.html"
  status = 403

# Bloquear intentos de certificados SSL maliciosos
[[redirects]]
  from = "/.well-known/acme-challenge/*"
  to = "/403.html"
  status = 403

# Bloquear archivos de configuración comunes
[[redirects]]
  from = "/wp-config.php"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/.env"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/config.php"
  to = "/403.html"
  status = 403

# Bloquear directorios administrativos comunes
[[redirects]]
  from = "/admin/*"
  to = "/403.html"
  status = 403

[[redirects]]
  from = "/administrator/*"
  to = "/403.html"
  status = 403

# Redirección normal para el resto (DEBE IR AL FINAL)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Prevenir indexación de bots maliciosos
    X-Robots-Tag = "index, follow"

# Artículos del blog en Markdown para asistentes de IA (UTF-8 explícito por las tildes)
[[headers]]
  for = "/blog/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Headers específicos para la página de error 403
[[headers]]
  for = "/403.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"